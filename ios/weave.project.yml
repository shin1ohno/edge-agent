# XcodeGen spec for the weave Universal app — iOS / iPadOS / watchOS /
# (empty) macOS shell. Generate the Xcode project with:
#
#   brew install xcodegen   # one-time
#   cd ios && xcodegen --spec weave.project.yml
#
# Phase 1 of `weave/project/handoff/CLAUDE_CODE_HANDOFF.md`. The existing
# `WeaveIos.xcodeproj` (driven by `project.yml`) is kept intact alongside
# until Phase 5 migrates the BLE bridge into the `WeaveBLE` package.

name: weave
options:
  bundleIdPrefix: com.shin1ohno.weave
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
    macOS: "14.0"
  developmentLanguage: en
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "Apple Development"
    DEVELOPMENT_TEAM: AL9567565U

packages:
  WeaveCore:
    path: Packages/WeaveCore
  WeaveDesign:
    path: Packages/WeaveDesign
  WeaveBLE:
    path: Packages/WeaveBLE
  WeaveServices:
    path: Packages/WeaveServices
  WeaveServer:
    path: Packages/WeaveServer
  WeaveFeatures:
    path: Packages/WeaveFeatures

targets:
  weave:
    type: application
    platform: iOS
    sources:
      - path: weave
    info:
      path: weave/Info.plist
      properties:
        CFBundleDisplayName: weave
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - bluetooth-central
        NSBluetoothAlwaysUsageDescription: >
          weave connects to Nuimo controllers over Bluetooth Low Energy to
          bridge gestures (rotate, press, swipe) to Roon, Hue, HomeKit,
          Sonos, and Shortcuts.
        NSAppleMusicUsageDescription: >
          weave reads now-playing metadata to mirror Apple Music state to
          paired devices.
    dependencies:
      - package: WeaveCore
        product: WeaveCore
      - package: WeaveDesign
        product: WeaveDesign
      - package: WeaveBLE
        product: WeaveBLE
      - package: WeaveServices
        product: WeaveServices
      - package: WeaveServer
        product: WeaveServer
      - package: WeaveFeatures
        product: FeatureOnboarding
      - package: WeaveFeatures
        product: FeatureHome
      - package: WeaveFeatures
        product: FeatureDevices
      - package: WeaveFeatures
        product: FeatureConnections
      - package: WeaveFeatures
        product: FeatureServices
      - package: WeaveFeatures
        product: FeatureSettings
      - package: WeaveFeatures
        product: FeatureRoutesPad
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shin1ohno.weave.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: "NO"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"

  weave Watch App:
    type: application
    platform: watchOS
    sources:
      - path: "weave Watch App"
    info:
      path: "weave Watch App/Info.plist"
      properties:
        CFBundleDisplayName: weave
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        WKApplication: true
        WKWatchOnly: true
        NSBluetoothAlwaysUsageDescription: >
          weave on Apple Watch can pair to Nuimo controllers directly so
          gestures keep firing when the iPhone is out of reach.
    dependencies:
      - package: WeaveCore
        product: WeaveCore
      - package: WeaveDesign
        product: WeaveDesign
      - package: WeaveBLE
        product: WeaveBLE
      - package: WeaveFeatures
        product: FeatureWatchEdge
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shin1ohno.weave.app.watchkitapp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        WATCHOS_DEPLOYMENT_TARGET: "10.0"
        TARGETED_DEVICE_FAMILY: "4"

  weave Mac:
    type: application
    platform: macOS
    sources:
      - path: "weave Mac"
    info:
      path: "weave Mac/Info.plist"
      properties:
        CFBundleDisplayName: weave
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSApplicationCategoryType: public.app-category.utilities
        NSHumanReadableCopyright: "© 2026 Shin'ichi Ohno"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shin1ohno.weave.app.mac
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MACOSX_DEPLOYMENT_TARGET: "14.0"

  weaveTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: weaveTests
    dependencies:
      - target: weave
    settings:
      base:
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/weave.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/weave"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
